name: Desktop Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-build.yml'
      - 'apps/app/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.node-version'
      - 'vite.config.ts'
      - 'tsconfig*.json'

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: macos-apple-silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - name: macos-intel
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - name: linux-x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/app/src-tauri -> target
          key: ${{ matrix.target }}

      # Bootstrap only. All project tasks and Tauri hooks use the pinned vp.
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Expose workspace tools to Tauri build hooks
        run: node -e "require('node:fs').appendFileSync(process.env.GITHUB_PATH, require('node:path').join(process.env.GITHUB_WORKSPACE, 'node_modules', '.bin') + '\n')"

      # No OAuth, Cloudflare, or signing secrets are passed to these PR builds.
      # Only dist/client is embedded; the Worker output is not uploaded.
      - name: Build desktop installer
        run: vp -C apps/app run tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked

      - name: Verify dependency lockfiles were not changed
        run: git diff --exit-code -- pnpm-lock.yaml apps/app/src-tauri/Cargo.lock

      - name: Upload test installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.name }}-${{ github.sha }}
          path: |
            apps/app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/app/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/app/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            apps/app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
