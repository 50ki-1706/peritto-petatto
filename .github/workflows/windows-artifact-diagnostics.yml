name: Windows Artifact Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-artifact-diagnostics.yml'
      - '.github/scripts/scan-windows-artifact.ps1'

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-artifact-diagnostics-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Fail before downloading if Defender or the no-sample-upload policy
      # is unavailable. Do not turn off antivirus or add exclusions.
      - name: Prepare Defender without automatic sample submission
        shell: powershell
        run: ./.github/scripts/scan-windows-artifact.ps1 -Stage Prepare

      - name: Verify the original artifact identity
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $artifact = Invoke-RestMethod -Headers $headers -Uri 'https://api.github.com/repos/50ki-1706/peritto-petatto/actions/artifacts/11249516824'
          if ($artifact.expired -or $artifact.workflow_run.id -ne 37058099538 -or
              $artifact.workflow_run.head_sha -ne 'fff018b63f52eba6aab00ea24cdaebe84d0da3fb' -or
              $artifact.name -ne 'desktop-windows-x64-c6ae6d7ebb513d0d50bbcea645d42716fcd88d7c' -or
              $artifact.digest -ne 'sha256:24d0e7ea2099abf973437d72e64ff73953496bd30e42fe38ef0f200bc4e53ade') {
            throw 'Original artifact identity mismatch or expired: not scanned.'
          }
          Write-Output "Source run: $($artifact.workflow_run.id); artifact ID: $($artifact.id); digest: $($artifact.digest)"

      # Pinned v8.0.1. Scan the old artifact, not a rebuilt approximation.
      - name: Download the original Windows installer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '11249516824'
          repository: 50ki-1706/peritto-petatto
          run-id: '37058099538'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/original-windows-artifact
          merge-multiple: true
          digest-mismatch: error

      - name: Inspect signature and scan without executing the installer
        shell: powershell
        run: ./.github/scripts/scan-windows-artifact.ps1 -Stage Scan

      # No installer is re-uploaded, published, installed, or executed.
      - name: Record an unsuccessful diagnostic
        if: failure()
        shell: powershell
        run: |
          '## Windows artifact diagnostic did not pass' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          'A detection, unavailable scanner, missing/quarantined file, or identity/download failure must be investigated in the logs. This is NOT a safety approval.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
